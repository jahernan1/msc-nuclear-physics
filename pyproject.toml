[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nucth"
version = "0.1.0"
description = "Relativistic mean-field nuclear structure and CEvNS cross sections"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Hernandez" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
notebooks = ["matplotlib>=3.8", "scikit-learn>=1.4", "jupyterlab>=4.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
nucth = "nucth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nucth"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "nucth/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "slow: characterization tests that run the full Dirac solver (minutes)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous name 'l' — physics convention for orbital angular momentum